  <!-- ── Textbook 1-10 Labels ── -->
  <!-- Each circle is placed at the anatomical structure it represents.     -->
  <!-- Positions calibrated to the vocal tract cross-section above.         -->

  <!-- Positions calibrated using getBBox() of each anatomy path:
       path2991 (palate surface): y=185  · path3015 (tongue): y=207–390
       path3021/3023 (vocal folds): y=313–344  · path3017 (trachea): y=293–390  -->

  <!-- 1 · Lips — mouth opening (front of face, left side) -->
  <circle class="lbl-circle" cx="72"  cy="200" r="11"/>
  <text   class="lbl-text"   x="72"  y="200">1</text>

  <!-- 2 · Teeth — just inside the lips -->
  <circle class="lbl-circle" cx="98"  cy="192" r="11"/>
  <text   class="lbl-text"   x="98"  y="192">2</text>

  <!-- 3 · Alveolar ridge — front of palate, just behind upper teeth -->
  <circle class="lbl-circle" cx="118" cy="177" r="11"/>
  <text   class="lbl-text"   x="118" y="177">3</text>

  <!-- 4 · Hard palate — centre of bony palate (path2991 mid-point) -->
  <circle class="lbl-circle" cx="145" cy="174" r="11"/>
  <text   class="lbl-text"   x="145" y="174">4</text>

  <!-- 5 · Velum (soft palate) — posterior edge of palate -->
  <circle class="lbl-circle" cx="185" cy="190" r="11"/>
  <text   class="lbl-text"   x="185" y="190">5</text>

  <!-- 6 · Uvula — hanging below velum into pharynx -->
  <circle class="lbl-circle" cx="202" cy="215" r="11"/>
  <text   class="lbl-text"   x="202" y="215">6</text>

  <!-- 7 · Tongue — body of tongue (path3015 upper region) -->
  <circle class="lbl-circle" cx="105" cy="265" r="11"/>
  <text   class="lbl-text"   x="105" y="265">7</text>

  <!-- 8 · Larynx / Glottis — laryngeal region (path3017) -->
  <circle class="lbl-circle" cx="192" cy="368" r="11"/>
  <text   class="lbl-text"   x="192" y="368">8</text>

  <!-- 9 · Vocal folds — at path3021/path3023 (y≈313–344) -->
  <circle class="lbl-circle" cx="173" cy="328" r="11"/>
  <text   class="lbl-text"   x="173" y="328">9</text>

  <!-- 10 · Nasal cavity — above hard palate (y<185), inside head -->
  <circle class="lbl-circle" cx="110" cy="128" r="12"/>
  <text   class="lbl-text"   x="110" y="128">10</text>

  <!-- Attribution -->
  <text class="attrib" x="376" y="397">Based on Tavin, CC BY 3.0 · Wikimedia Commons</text>
</svg>
